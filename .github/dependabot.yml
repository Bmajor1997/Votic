version: 2
updates:
  # Keeps the commit-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      # Wait a week before adopting a new release, so hijacked or broken releases are usually pulled first.
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # Backend dependencies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"

  # Mobile app. Expo fixes which major versions work together, so majors move only with an Expo SDK upgrade.
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # React Native requires React's exact version, so these move only together, with Expo.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      # The test renderer must match React's exact version too.
      - dependency-name: "react-test-renderer"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(mobile)"
