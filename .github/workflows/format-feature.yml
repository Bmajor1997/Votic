name: One-time feature formatter
on:
  push:
    branches:
      - feature/reader-intelligence-production
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/reader-intelligence-production
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Format feature files
        working-directory: apps/mobile
        run: |
          npm ci --ignore-scripts
          npx prettier --write "app/(tabs)/documents.tsx" "app/(tabs)/settings.tsx" app/check-understanding.tsx app/import-web.tsx app/pronunciations.tsx app/reader.tsx app/review.tsx src/api/voticApi.ts src/documents/catchUp.ts src/reader/components/ReaderSettingsSheet.tsx src/reader/comprehension.test.ts src/reader/comprehension.ts src/reader/pronunciationDictionary.ts
      - name: Commit formatting and remove one-time workflow
        run: |
          rm .github/workflows/format-feature.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile .github/workflows/format-feature.yml
          git commit -m "Format reader intelligence feature files"
          git push origin HEAD:feature/reader-intelligence-production
