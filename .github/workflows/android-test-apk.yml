name: Android Test APK (Google Cloud backend)

# Builds an installable release APK (JavaScript bundled, no Metro needed) for manual testing on the
# emulator or a phone. All EXPO_PUBLIC_* values below are public client identifiers that ship inside
# the app (Firebase web config, public app gateway key, backend URL). Never add secret keys here.
on:
  push:
    branches: ["claude/v1-all-oct30"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-test-apk-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_NO_TELEMETRY: "1"
      EAS_BUILD_PROFILE: preview
      EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyAxlf77We41rIP0x3CylHE24kqBjcAD8yc
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: votic-da5c4.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: votic-da5c4
      EXPO_PUBLIC_FIREBASE_APP_ID: "1:562186959755:web:d73025f437c45490b14d8e"
      EXPO_PUBLIC_VOTIC_CLIENT_KEY: 0d8fe5ded3d05f8c97f2353531fe890e48e909dd8b1af158
      EXPO_PUBLIC_VOTIC_API_URL: https://136-72-31-77.sslip.io
      EXPO_PUBLIC_VOTIC_TERMS_URL: https://136-72-31-77.sslip.io/terms
      EXPO_PUBLIC_VOTIC_PRIVACY_URL: https://136-72-31-77.sslip.io/privacy
      # Google sign-in: the Firebase Google provider's Web client ID. The APK's SHA-1 must be on the
      # Firebase Android app (com.votic.app); the "Print signing fingerprint" step shows it.
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 562186959755-g37j6f6gjmg7gdsihouk00dkjgrvtekl.apps.googleusercontent.com
      # RevenueCat public Android SDK key (Play app app713897a509) and the existing entitlement.
      EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY: goog_TiurUfaynPFCRbnABgRbJmivPBt
      EXPO_PUBLIC_REVENUECAT_ENTITLEMENT_ID: premium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install app dependencies
        run: npm ci --ignore-scripts
      - name: Install and validate Android NDK
        run: bash ../../security/install-android-ndk.sh
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK (emulator x86_64 + phone arm64)
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=x86_64,arm64-v8a
        env:
          NODE_ENV: production
      - name: Print signing fingerprint
        working-directory: apps/mobile/android
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/*.apk | grep -E "SHA-1|SHA-256"
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: votic-test-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
