name: Votic Reliability & Edge-Case Checks

on:
  push:
    paths:
      - "apps/mobile/**"
      - "app_parts/**"
      - "votic_server.js"
      - "code_checks/**"
      - "security/**"
      - "package*.json"
      - ".github/workflows/reliability-edge-cases.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "app_parts/**"
      - "votic_server.js"
      - "code_checks/**"
      - "security/**"
      - "package*.json"
      - ".github/workflows/reliability-edge-cases.yml"
  schedule:
    - cron: "23 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reliability:
    name: Mobile Reliability Regression Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get Votic's code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      # Server regression tests run once in the Security workflow's backend coverage suite.

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci --ignore-scripts

      - name: Run Vitest behavioral reliability tests
        if: ${{ !cancelled() }}
        working-directory: apps/mobile
        run: npm run test:coverage

      - name: Run mobile component tests
        if: ${{ !cancelled() }}
        working-directory: apps/mobile
        run: npm run test:components:coverage

      - name: Lint mobile code
        if: ${{ !cancelled() }}
        working-directory: apps/mobile
        run: npm run lint

      - name: Check mobile code formatting
        if: ${{ !cancelled() }}
        working-directory: apps/mobile
        run: npm run format:check

      - name: Type-check reliability-sensitive mobile code
        if: ${{ !cancelled() }}
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Validate Expo configuration
        if: ${{ !cancelled() }}
        working-directory: apps/mobile
        run: npx expo config --type public

      - name: Check Expo dependency compatibility
        if: ${{ !cancelled() }}
        working-directory: apps/mobile
        run: npx expo install --check

      - name: Prevent complexity regressions
        if: ${{ !cancelled() }}
        run: node security/code-metrics.cjs

      - name: Preserve coverage and complexity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assurance-evidence
          path: |
            apps/mobile/coverage/
            quality-evidence/
          retention-days: 90
