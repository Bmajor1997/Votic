name: Votic Mobile Dependency Security Report

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1"
  push:
    paths:
      - "apps/mobile/package.json"
      - "apps/mobile/package-lock.json"

permissions:
  contents: read

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Get Votic's code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install mobile dependencies
        run: npm install --ignore-scripts
      - name: Generate dependency security report
        run: node ../../security/generate-mobile-dependency-report.cjs
      - name: Preserve dependency security report
        uses: actions/upload-artifact@v4
        with:
          name: mobile-dependency-security-report
          path: security/mobile-dependency-report.md
