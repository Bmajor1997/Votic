name: Votic Mobile Dependency Security Report

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1"
  push:
    paths:
      - "apps/mobile/package.json"
      - "apps/mobile/package-lock.json"

permissions:
  contents: read

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Get Votic's code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install mobile dependencies
        run: npm install --ignore-scripts
      - name: Generate dependency security report
        run: node ../../security/generate-mobile-dependency-report.cjs
      - name: Preserve dependency security report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-dependency-security-report
          path: security/mobile-dependency-report.md
