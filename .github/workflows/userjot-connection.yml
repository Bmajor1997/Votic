name: UserJot connection check

on:
  push:
    branches: [feature/userjot-feedback]
    paths:
      - "integrations/userjot.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/userjot-connection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Verify UserJot API access and request tool schema
        run: node integrations/userjot.js
        env:
          USERJOT_API_TOKEN: ${{ secrets.USERJOT_API_TOKEN }}
