name: Android Full App & Playback Build

on:
  push:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-notification-playback.yml"
      - "security/install-android-ndk.sh"
      - "security/android-smoke.sh"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-notification-playback.yml"
      - "security/install-android-ndk.sh"
      - "security/android-smoke.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notification-playback-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android-module:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install smoke test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          rg --version
      - name: Install app dependencies
        run: npm ci --ignore-scripts
      - name: Install and validate Android NDK
        run: bash ../../security/install-android-ndk.sh
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Build complete app, widgets, playback and bundled JavaScript
        working-directory: apps/mobile/android
        run: ./gradlew :votic-playback:compileDebugKotlin :votic-playback:processDebugManifest :votic-widgets:compileDebugKotlin :app:assembleRelease :app:bundleRelease --no-daemon --max-workers=2
        env:
          NODE_ENV: production
          EXPO_NO_TELEMETRY: "1"
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Install and launch the bundled release app
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash "${{ github.workspace }}/security/android-smoke.sh" "${{ github.workspace }}/apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
      - name: Preserve CI app build and smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-ci-build
          path: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            apps/mobile/android/app/build/outputs/bundle/release/*.aab
            android-smoke-*.txt
          retention-days: 7
