name: Android Notification Playback Build

on:
  push:
    paths:
      - "apps/mobile/modules/votic-playback/**"
      - "apps/mobile/src/playback/**"
      - "apps/mobile/app/reader.tsx"
      - ".github/workflows/android-notification-playback.yml"
  pull_request:
    paths:
      - "apps/mobile/modules/votic-playback/**"
      - "apps/mobile/src/playback/**"
      - "apps/mobile/app/reader.tsx"
      - ".github/workflows/android-notification-playback.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notification-playback-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android-module:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install app dependencies
        run: npm ci --ignore-scripts
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: "1"
      - name: Compile notification playback and process its manifest
        working-directory: apps/mobile/android
        run: ./gradlew :votic-playback:compileDebugKotlin :votic-playback:processDebugManifest --no-daemon --max-workers=2
