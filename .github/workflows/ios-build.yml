name: iOS App & Widgets Build
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Test native dependency hardening
        run: node --test ../../code_checks/native_dependency_hardening.test.js
      - name: Generate app and widget targets
        run: npx expo prebuild --platform ios --no-install
        env:
          EXPO_NO_TELEMETRY: "1"
      - run: npx pod-install ios
      - name: Initialize native CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: swift
          build-mode: manual
      - name: Compile full simulator app and widget extension
        run: xcodebuild -workspace ios/Votic.xcworkspace -scheme Votic -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios-build CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
        env:
          NODE_ENV: production
          EXPO_NO_TELEMETRY: "1"

      - name: Test widget model
        run: |
          mkdir -p native-test-results
          swiftc targets/widget/VoticSnapshot.swift native-tests/main.swift -o native-test-results/widget-tests
          native-test-results/widget-tests > native-test-results/widget-tests.txt
      - name: Analyze native code
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: native-ios
          output: native-sarif
          upload: false
      - name: Gate native analysis findings
        run: node ../../security/check-sarif.cjs ../../native-sarif
      - name: Preserve iOS verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-assurance-evidence
          path: |
            native-sarif/
            apps/mobile/native-test-results/
          retention-days: 90
